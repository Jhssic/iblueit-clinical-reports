version: '3.3'

services:
  iblueit-mongo:
    image: mongo
    container_name: iblueit-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: '${MONGO_ROOT_USERNAME}'
      MONGO_INITDB_ROOT_PASSWORD: '${MONGO_ROOT_PASSWORD}'

  iblueit-proxy:
    image: iblueit/proxy:latest
    container_name: iblueit-proxy
    ports:
     - "7071:80"

  iblueit-api:
    image: iblueit/api:latest
    container_name: iblueit-api
    ports:
      - "8080:80"
    environment:
      MongoDbAtlas: '${MONGODB_ATLAS_URI}'
      SMTP_Server_Hostname: '${SMTP_SERVER_HOSTNAME}'
      SMTP_Server_Username: '${SMTP_SERVER_USERNAME}'
      SMTP_Server_Password: '${SMTP_SERVER_PASSWORD}'
      URL_API_IA: 'http://iblueit-ia:5000/'
    links:
      - "iblueit-mongo:iblueit-mongo"
      - "iblueit-ia:iblueit-ia"

  iblueit-front:
    image: iblueit/front:latest
    container_name: iblueit-front
    ports:
      - "3000:80"
    environment:
      API_URL: 'http://localhost:7071/api'
    links:
      - "iblueit-api:iblueit-api"

  iblueit-ia:
    image: iblueit/ia:latest
    container_name: iblueit-ia
    ports:
      - "5000:5000"
    environment:
      MongoDbAtlas: '${MONGODB_ATLAS_URI}'
    links:
      - "iblueit-api:iblueit-api"
