server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida (ex: /clinicalreport) cai no index.html,
    # e o react-router-dom resolve a navegação no próprio navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
