# Deploy do frontend (React, servido por nginx) pro Azure Container Apps.
# Mesmo padrão do report-ai-deploy.yml: builda, envia pro ACR e atualiza o
# Container App, reaproveitando a identidade OIDC já usada pelo Function App.

name: Build and deploy frontend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'iblueit-health-Infocharts/**'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: iblueitclinicalreportsacr.azurecr.io
  IMAGE_NAME: iblueit-frontend
  CONTAINER_APP_NAME: iblueit-frontend
  RESOURCE_GROUP: rg-iblueit-clinical-reports

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Login na Azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A83E6C38D3E4E44A8930C359187A9C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_325A9A328E5E41BEA16B0294751AF5F9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_27D7A7A892AE4754B846CB9695B86D5B }}

      - name: 'Login no Azure Container Registry'
        run: az acr login --name iblueitclinicalreportsacr

      - name: 'Build e push da imagem'
        uses: docker/build-push-action@v6
        with:
          context: ./iblueit-health-Infocharts
          push: true
          build-args: |
            REACT_APP_BASE_URL_I_BLUE_IT=https://iblueit-clinical-reports-api-endwfqcrd0gbbghb.mexicocentral-01.azurewebsites.net/api
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Na primeira execução esse passo falha (o Container App ainda não
      # existe) — é esperado. Depois que o app for criado, rode de novo
      # (aba Actions → "Run workflow").
      - name: 'Atualiza o Container App com a nova imagem'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
