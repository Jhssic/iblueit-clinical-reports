sonar.projectKey=Jhssic_iblueit-clinical-reports
sonar.organization=jhssic-iblueit-clinical-reports

sonar.sources=iblueit-health-Infocharts/src,iblueit-server-side
sonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**,**/build/**,**/*.test.js,**/test_*.py,**/coverage/**,**/test-utils/**,**/testUtils/**

# Testes ficam fora de sonar.sources (acima) mas são declarados aqui pro Sonar
# reconhecê-los como código de teste.
sonar.tests=iblueit-health-Infocharts/src,iblueit-server-side
sonar.test.inclusions=**/*.test.js,**/test_*.py,**/test-utils/**,**/testUtils/**
sonar.test.exclusions=**/node_modules/**,**/venv/**

# Relatórios de cobertura gerados no workflow .github/workflows/sonarcloud.yml:
#   - IA (report-ai, Python): pytest-cov -> coverage.xml
#   - Back-end e front-end (JavaScript): Jest -> coverage/lcov.info
sonar.python.coverage.reportPaths=iblueit-server-side/report-ai/coverage.xml
sonar.javascript.lcov.reportPaths=iblueit-server-side/coverage/lcov.info,iblueit-health-Infocharts/coverage/lcov.info

# Fora da conta de cobertura só o que não é código da aplicação: scripts
# avulsos de desenvolvimento (popular/exportar banco local) e o ponto de
# entrada do React (só monta <App/> no DOM).
sonar.coverage.exclusions=\
  iblueit-server-side/seed-test-data.js,\
  iblueit-server-side/export-patient-data.js,\
  iblueit-server-side/query.js,\
  iblueit-health-Infocharts/src/index.js,\
  iblueit-health-Infocharts/src/reportWebVitals.js,\
  iblueit-health-Infocharts/src/setupTests.js,\
  iblueit-health-Infocharts/src/providers/_config.template.js

sonar.sourceEncoding=UTF-8
