sonar.projectKey=Jhssic_iblueit-clinical-reports
sonar.organization=jhssic-iblueit-clinical-reports

sonar.sources=iblueit-health-Infocharts/src,iblueit-server-side
sonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**,**/build/**,**/*.test.js,**/test_*.py,**/coverage/**

sonar.python.coverage.reportPaths=iblueit-server-side/report-ai/coverage.xml

# Decisão consciente (não é preguiça): essas partes não têm teste ainda e
# exigiriam mock pesado de Mongoose/axios (handlers de Azure Function) ou de
# contexto/API inteiros (tela React) pra cobrir de verdade — custo
# desproporcional pro estágio atual do projeto. Ficam isentas da exigência de
# cobertura em vez de a gente baixar o limite de 80% pro projeto inteiro, que
# enfraqueceria a régua também pro código novo daqui pra frente.
sonar.coverage.exclusions=\
  iblueit-health-Infocharts/src/pages/clinicalReport/index.js,\
  iblueit-health-Infocharts/src/services/api/clinicalReport.js,\
  iblueit-health-Infocharts/src/providers/_config.js,\
  iblueit-server-side/shared/alertEvaluation.js,\
  iblueit-server-side/shared/utils.js,\
  iblueit-server-side/DeleteClinicalReport/**,\
  iblueit-server-side/GenerateClinicalReport/**,\
  iblueit-server-side/GetPacients/**,\
  iblueit-server-side/ArchiveClinicalReport/**

sonar.sourceEncoding=UTF-8
